apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker-service
  template:
    metadata:
      labels:
        app: broker-service 
    spec:
      containers:
      - name: broker-service
        image: ""
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
        ports:
          - containerPort: 5672

---

apiVersion: v1
kind: Service
metadata:
  name: broker-service
spec:
  selector:
    name: broker-service
  ports:
    - protocol: TCP
      name: main-port
      port: 5672
      targetPort: 5672